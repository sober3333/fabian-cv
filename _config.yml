resume_header_intro: "<p>Führungskraft in der Unternehmenskommunikation mit über zehn Jahren Erfahrung in der internen und externen Kommunikation. Mein Fokus liegt auf dem Aufbau und der inhaltlichen Entwicklung von reichweitenstarken digitalen Kommunikationsplattformen für B2B-Unternehmen. Ich entwickle nachhaltige Unternehmenskommunikation durch die Einführung leistungsstarker redaktioneller Strukturen und effektiver Kommunikationsprozesse.</p>"

