resume_header_intro: "<p>Führungskraft in der Unternehmenskommunikation mit über zehn Jahren Berufserfahrung: Verantwortung für interne und externe Kommunikation mit besonderem Fokus auf interne Kommunikation und Social Media. Erfahren im Aufbau von Corporate Ambassadors und der Entwicklung von Corporate Accounts in den sozialen Medien. Fokus auf die Einführung effektiver, softwaregestützter redaktioneller Strukturen und transparenter Freigabeprozesse. Langjährige Erfahrung in der Entwicklung kreativer Kommunikationskonzepte für interne und externe Kommunikation.</p>"

